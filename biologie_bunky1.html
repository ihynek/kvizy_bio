        const SKRIPT_URL = "https://script.google.com/macros/s/AKfycbxHhRFxVE_xZHk4Gnzc8g8Cv0k_1SwWuvGpiGMkQcEhIOB9oozzXJ-VPp_pacArYjOJ/exec";

        /*
        Volání skriptu technikou JSONP – obchází omezení prohlížeče
        na požadavky mezi doménami.
        */
        const zavolejSkript = (params) => new Promise((resolve, reject) => {
            const jmenoFce = 'kvizOdpoved_' + Math.random().toString(36).slice(2);
            const znacka = document.createElement('script');

            const casovac = setTimeout(() => { uklid(); reject(new Error('vyprselo')); }, 15000);

            function uklid() {
                clearTimeout(casovac);
                try { delete window[jmenoFce]; } catch (e) { window[jmenoFce] = undefined; }
                if (znacka.parentNode) znacka.parentNode.removeChild(znacka);
            }

            window[jmenoFce] = (data) => { uklid(); resolve(data); };
            znacka.onerror = () => { uklid(); reject(new Error('spojeni')); };

            const dotaz = Object.keys(params)
                .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
                .join('&');

            znacka.src = SKRIPT_URL + '?' + dotaz + '&callback=' + jmenoFce;
            document.body.appendChild(znacka);
        });

            // ========================================
            // KONEC NASTAVENÍ
            // ========================================

            const shuffleArray = (array) => {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            };

            // 🎲 Zamíchání otázek + odpovědí
            const [questions, setQuestions] = useState(() => {
                const shuffledQuestions = shuffleArray(QUIZ_CONFIG.questions);
                // Pro každou otázku typu 'multiple' zamíchat i odpovědi
                return shuffledQuestions.map(q => {
                    if (q.type === 'multiple') {
                        const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                        const shuffledOptions = shuffleArray(optionsWithIndex);
                        return {
                            ...q,
                            options: shuffledOptions.map(o => o.text),
                            correct: shuffledOptions.findIndex(o => o.originalIndex === q.correct)
                        };
                    }
                    if (q.type === 'checkbox') {
                        const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                        const shuffledOptions = shuffleArray(optionsWithIndex);
                        return {
                            ...q,
                            options: shuffledOptions.map(o => o.text),
                            correct: q.correct.map(c => shuffledOptions.findIndex(o => o.originalIndex === c)).sort((a, b) => a - b)
                        };
                    }
                    return q;
                });
            });
            
            const [currentQuestion, setCurrentQuestion] = useState(0);

            const [studentJmeno, setStudentJmeno] = useState('');

            const [vstupOk, setVstupOk] = useState(false);
            const [vstupOveruje, setVstupOveruje] = useState(false);
            const [vstupChyba, setVstupChyba] = useState('');
            const [chybaOdeslani, setChybaOdeslani] = useState('');
            const [isSending, setIsSending] = useState(false);
            const [emailSent, setEmailSent] = useState(false);
            const [quizCompleted, setQuizCompleted] = useState(false);
            
            // ⏱️ ČASOVAČ - nové state proměnné
            const totalTimeLimit = QUIZ_CONFIG.timePerQuestion * questions.length;
            const [timeLeft, setTimeLeft] = useState(totalTimeLimit);
            const [startTime, setStartTime] = useState(Date.now());
            const timeExpiredRef = useRef(false);
            
            // 🔍 DETEKCE PŘEPÍNÁNÍ OKEN
            const [windowSwitches, setWindowSwitches] = useState(0);

            // ⏱️ ČASOVAČ - odpočítávání
            useEffect(() => {
                if (!vstupOk || showResults || quizCompleted) return;

                const timer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const remaining = totalTimeLimit - elapsed;
                    
                    if (remaining <= 0 && !timeExpiredRef.current) {
                        timeExpiredRef.current = true;
                        setTimeLeft(0);
                        setShowResults(true);
                    } else {
                        setTimeLeft(Math.max(0, remaining));
                    }
                }, 1000);

                return () => clearInterval(timer);
            }, [vstupOk, startTime, totalTimeLimit, showResults, quizCompleted]);

            // 🔍 DETEKCE PŘEPÍNÁNÍ OKEN
            useEffect(() => {
                if (!vstupOk || showResults || quizCompleted) return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setWindowSwitches(prev => prev + 1);
                    }
                };

                const handleBlur = () => {
                    setWindowSwitches(prev => prev + 1);
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('blur', handleBlur);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    window.removeEventListener('blur', handleBlur);
                };
            }, [vstupOk, showResults, quizCompleted]);

            // 🔒 ZÁKAZ KOPÍROVÁNÍ TEXTU
            useEffect(() => {
                const preventCopy = (e) => e.preventDefault();
                const preventContextMenu = (e) => e.preventDefault();

                document.addEventListener('copy', preventCopy);
                document.addEventListener('cut', preventCopy);
                document.addEventListener('contextmenu', preventContextMenu);

                return () => {
                    document.removeEventListener('copy', preventCopy);
                    document.removeEventListener('cut', preventCopy);
                    document.removeEventListener('contextmenu', preventContextMenu);
                };
            }, []);

            // 🚪 VAROVÁNÍ PŘI ZAVŘENÍ STRÁNKY
            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    if (!showResults && !quizCompleted && Object.keys(answers).length > 0) {
                        e.preventDefault();
                        e.returnValue = '';
                        return '';
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, [showResults, quizCompleted, answers]);

            // Formátování času pro zobrazení
            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins} minut ${secs} sekund`;
            };

            // Zjištění skutečného času strávení
            const getElapsedTime = () => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                return Math.min(elapsed, totalTimeLimit);
            };

            // Kontrola, jestli student už kvíz vyplnil
            useEffect(() => {
                const completedKey = `quiz_completed_${QUIZ_CONFIG.title}`;
                const isCompleted = localStorage.getItem(completedKey);
                if (isCompleted) {
                    setQuizCompleted(true);
                }
            }, []);

            const handleAnswer = (answer) => {
                setAnswers({ ...answers, [currentQuestion]: answer });
            };

            const handleNext = () => {
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    setShowResults(true);
                }
            };

            const handlePrevious = () => {
                if (currentQuestion > 0) {
                    setCurrentQuestion(currentQuestion - 1);
                }
            };

            const handleFirst = () => setCurrentQuestion(0);
            const handleLast = () => setCurrentQuestion(questions.length - 1);

            // ========================================
            // BODOVÁNÍ – shodné s velkými testy
            //   ANO/NE a výběr jedné možnosti ...... 1 bod
            //   zaškrtávací otázka ................. +1 za správně označenou možnost,
            //                                        −1 za chybně označenou možnost
            //                                        (může vyjít i záporně)
            //   celkový součet ..................... nikdy neklesne pod 0
            // ========================================

            // Maximální počet bodů za otázku
            const maxBodu = (q) => (q.type === 'checkbox' ? q.correct.length : 1);

            // Body, které student za otázku skutečně získal (u checkboxu i záporné)
            const bodyZaOtazku = (q, userAnswer) => {
                if (q.type === 'checkbox') {
                    const ua = Array.isArray(userAnswer) ? userAnswer : [];
                    const spravne = ua.filter(i => q.correct.includes(i)).length;
                    const chybne  = ua.filter(i => !q.correct.includes(i)).length;
                    return spravne - chybne;
                }
                return userAnswer === q.correct ? 1 : 0;
            };

            // Úplně správně (zelený rámeček a ✓ v přehledu)
            const isAnswerCorrect = (q, userAnswer) => bodyZaOtazku(q, userAnswer) === maxBodu(q);

            const isQuestionAnswered = (q, userAnswer) => {
                if (q.type === 'checkbox') return Array.isArray(userAnswer) && userAnswer.length > 0;
                return userAnswer !== undefined;
            };

            // Známka podle stejné stupnice jako ve velkých testech
            const urciZnamku = (procenta) => {
                if (procenta <  40) return 5;
                if (procenta <= 54) return 4;
                if (procenta <= 74) return 3;
                if (procenta <= 89) return 2;
                return 1;
            };

            const maxBoduCelkem = questions.reduce((s, q) => s + maxBodu(q), 0);

            // Součet bodů za celý kvíz, zdola omezený nulou
            const calculateScore = () => {
                let score = 0;
                questions.forEach((q, index) => { score += bodyZaOtazku(q, answers[index]); });
                return Math.max(0, score);
            };

            const toggleCheckbox = (optionIndex) => {
                const current = Array.isArray(answers[currentQuestion]) ? answers[currentQuestion] : [];
                const next = current.includes(optionIndex)
                    ? current.filter(i => i !== optionIndex)
                    : [...current, optionIndex].sort((a, b) => a - b);
                setAnswers({ ...answers, [currentQuestion]: next });
            };

            // ========================================
            // PŘIHLÁŠENÍ KÓDEM
            // ========================================
            const overKod = async () => {
                const kod = kodInput.trim();
                if (!kod) { setVstupChyba('Zadej svůj kód.'); return; }

                if (!/^https:\/\//.test(SKRIPT_URL)) {
                    setVstupChyba('Kvíz zatím není propojen se serverem. Dej vědět učiteli.');
                    return;
                }

                setVstupOveruje(true);
                setVstupChyba('');

                try {
                    const data = await zavolejSkript({
                        action: 'check',
                        code: kod,
                        kviz: QUIZ_CONFIG.title
                    });

                    if (!data || !data.ok) {
                        setVstupChyba('Kód nebyl rozpoznán. Zkontroluj ho, nebo se ozvi učiteli.');
                    } else if (data.jiz_odevzdal) {
                        setVstupChyba('Tento kvíz už máš odevzdaný.');
                    } else {
                        setStudentKod(kod);
                        setStudentJmeno(data.jmeno || '');
                        setStudentTrida(data.trida || '');
                        setStartTime(Date.now());
                        setTimeLeft(totalTimeLimit);
                        setVstupOk(true);
                    }
                } catch (err) {
                    setVstupChyba('Nepodařilo se spojit se serverem. Zkontroluj připojení k internetu.');
                } finally {
                    setVstupOveruje(false);
                }
            };

            // ========================================
            // ODESLÁNÍ VÝSLEDKŮ
            // ========================================
            const odesliVysledky = async () => {
                if (emailSent || isSending) return;

                setIsSending(true);
                setChybaOdeslani('');

                const score = calculateScore();
                const procentaCislo = maxBoduCelkem > 0 ? (score / maxBoduCelkem * 100) : 0;
                const percentage = procentaCislo.toFixed(1);
                const grade = urciZnamku(procentaCislo);
                const elapsedSeconds = getElapsedTime();
                const timeSpent = formatTime(elapsedSeconds);

                // Zámek proti opakovanému vyplnění v tomto prohlížeči
                const completedKey = `quiz_completed_${QUIZ_CONFIG.title}`;
                localStorage.setItem(completedKey, JSON.stringify({
                    name: studentJmeno,
                    date: new Date().toISOString(),
                    score: `${score}/${maxBoduCelkem} bodů`,
                    time: timeSpent,
                    windowSwitches: windowSwitches
                }));

                // Rozpis odpovědí
                let answersDetails = '';
                questions.forEach((q, index) => {
                    const userAnswer = answers[index];
                    const isCorrect = isAnswerCorrect(q, userAnswer);
                    const b = bodyZaOtazku(q, userAnswer);

                    answersDetails += `${index + 1}. ${q.question}\n`;

                    if (q.type === 'multiple') {
                        answersDetails += `Student: ${userAnswer !== undefined ? q.options[userAnswer] : 'Bez odpovědi'}\n`;
                        answersDetails += `Správně: ${q.options[q.correct]}\n`;
                    } else if (q.type === 'boolean') {
                        answersDetails += `Student: ${userAnswer !== undefined ? (userAnswer ? 'Pravda' : 'Nepravda') : 'Bez odpovědi'}\n`;
                        answersDetails += `Správně: ${q.correct ? 'Pravda' : 'Nepravda'}\n`;
                    } else if (q.type === 'checkbox') {
                        const ua = Array.isArray(userAnswer) ? userAnswer : [];
                        answersDetails += `Student: ${ua.length > 0 ? ua.map(i => q.options[i]).join(', ') : 'Bez odpovědi'}\n`;
                        answersDetails += `Správně: ${q.correct.map(i => q.options[i]).join(', ')}\n`;
                    }

                    const znacka = isCorrect ? '✓' : (b > 0 ? '~' : '✗');
                    answersDetails += `Výsledek: ${znacka} ${b} z ${maxBodu(q)} b.\n\n`;
                });

                const zasilka = {
                    kod: studentKod,
                    kviz: QUIZ_CONFIG.title,
                    body: score,
                    maxBody: maxBoduCelkem,
                    procenta: Number(percentage),
                    znamka: grade,
                    cas: timeSpent,
                    prepnuti: windowSwitches,
                    odpovedi: answersDetails
                };

                try {
                    const odpoved = await fetch(SKRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(zasilka)
                    });
                    const vysledek = await odpoved.json();

                    if (vysledek && vysledek.ok) {
                        setEmailSent(true);
                    } else {
                        setChybaOdeslani('Server výsledky nepřijal. Zkus to prosím znovu.');
                    }
                } catch (err) {
                    // Odpověď se nepodařilo přečíst – ověříme, zda výsledky přesto dorazily
                    try {
                        const kontrola = await zavolejSkript({
                            action: 'verify',
                            code: studentKod,
                            kviz: QUIZ_CONFIG.title
                        });
                        if (kontrola && kontrola.ok && kontrola.zapsano) {
                            setEmailSent(true);
                        } else {
                            setChybaOdeslani('Výsledky se nepodařilo odeslat. Zkus to prosím znovu.');
                        }
                    } catch (e2) {
                        setChybaOdeslani('Výsledky se nepodařilo odeslat. Zkus to prosím znovu.');
                    }
                } finally {
                    setIsSending(false);
                }
            };

            // Výsledky se odešlou samy, jakmile je kvíz hotový
            useEffect(() => {
                if (!showResults || !vstupOk || emailSent || isSending) return;
                odesliVysledky();
            }, [showResults, vstupOk]);

            // Zobrazení hlášky, když už byl kvíz vyplněn
            if (quizCompleted) {
                const completedKey = `quiz_completed_${QUIZ_CONFIG.title}`;
                const completionData = JSON.parse(localStorage.getItem(completedKey) || '{}');
                
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                        <div className="max-w-2xl mx-auto bg-white rounded-lg shadow-xl p-8">
                            <div className="text-center">
                                <div className="text-6xl mb-4">🔒</div>
                                <h1 className="text-3xl font-bold text-indigo-900 mb-4">
                                    Kvíz již byl vyplněn
                                </h1>
                                <p className="text-gray-700 text-lg mb-6">
                                    Tento kvíz jsi již dokončil a odeslal učiteli.
                                </p>
                                {completionData.name && (
                                    <div className="bg-blue-50 border-2 border-blue-300 rounded-lg p-6 mb-6">
                                        <p className="text-gray-700 mb-2">
                                            <strong>Jméno:</strong> {completionData.name}
                                        </p>
                                        <p className="text-gray-700 mb-2">
                                            <strong>Výsledek:</strong> {completionData.score}
                                        </p>
                                        {completionData.time && (
                                            <p className="text-gray-700 mb-2">
                                                <strong>Čas:</strong> {completionData.time}
                                            </p>
                                        )}
                                        {completionData.windowSwitches !== undefined && completionData.windowSwitches > 0 && (
                                            <p className="text-gray-700 mb-2">
                                                <strong>Přepnutí oken:</strong> {completionData.windowSwitches}×
                                            </p>
                                        )}
                                        <p className="text-gray-700">
                                            <strong>Datum:</strong> {new Date(completionData.date).toLocaleString('cs-CZ')}
                                        </p>
                                    </div>
                                )}
                                <p className="text-gray-600 text-sm">
                                    Každý student může kvíz vyplnit pouze jednou. Pokud si myslíš, že je to chyba, kontaktuj svého učitele.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            // Úvodní obrazovka – zadání kódu
            if (!vstupOk) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                        <div className="max-w-md mx-auto bg-white rounded-lg shadow-xl p-8">
                            <div className="text-center mb-6">
                                <div className="text-5xl mb-3">🔑</div>
                                <h1 className="text-2xl font-bold text-indigo-900 mb-2">
                                    {QUIZ_CONFIG.title}
                                </h1>
                                <p className="text-gray-600 text-sm">
                                    Zadej svůj přístupový kód. Jméno se doplní samo.
                                </p>
                            </div>

                            <input
                                type="text"
                                inputMode="text"
                                autoFocus
                                placeholder="Přístupový kód"
                                value={kodInput}
                                onChange={(e) => setKodInput(e.target.value)}
                                onKeyDown={(e) => { if (e.key === 'Enter') overKod(); }}
                                disabled={vstupOveruje}
                                className="w-full p-3 text-center text-lg tracking-widest border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none disabled:bg-gray-100 mb-3"
                            />

                            {vstupChyba && (
                                <p className="text-red-600 text-sm text-center mb-3">{vstupChyba}</p>
                            )}

                            <button
                                onClick={overKod}
                                disabled={vstupOveruje}
                                className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed"
                            >
                                {vstupOveruje ? 'Ověřuji…' : 'Spustit kvíz'}
                            </button>

                            <p className="text-gray-500 text-xs text-center mt-4">
                                Čas začne běžet po spuštění.
                            </p>
                        </div>
                    </div>
                );
            }

            if (showResults) {
                const score = calculateScore();
                const procentaCislo = maxBoduCelkem > 0 ? (score / maxBoduCelkem * 100) : 0;
                const percentage = procentaCislo.toFixed(1);
                const znamka = urciZnamku(procentaCislo);
                const elapsedSeconds = getElapsedTime();
                const timeSpent = formatTime(elapsedSeconds);
                const wasTimeExpired = timeExpiredRef.current;
                
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                        <div className="max-w-3xl mx-auto bg-white rounded-lg shadow-xl p-8">
                            <h1 className="text-3xl font-bold text-center text-indigo-900 mb-6">
                                Výsledky kvízu
                            </h1>
                            
                            {/* ⏱️ ZOBRAZENÍ ČASU */}
                            <div className={`border-2 rounded-lg p-4 mb-4 text-center ${wasTimeExpired ? 'bg-red-100 border-red-400' : 'bg-blue-100 border-blue-400'}`}>
                                <div className={`text-2xl font-bold ${wasTimeExpired ? 'text-red-800' : 'text-blue-800'}`}>
                                    {wasTimeExpired ? '⏰ Čas vypršel!' : `⏱️ Čas: ${timeSpent}`}
                                </div>
                                {wasTimeExpired && (() => {
                                    const unansweredCount = questions.filter((qq, i) => !isQuestionAnswered(qq, answers[i])).length;
                                    return (
                                        <p className="text-red-700 text-sm mt-2">
                                            Kvíz byl automaticky ukončen po {formatTime(totalTimeLimit)}. Nevyplněné otázky jsou hodnoceny 0 body.
                                            <br />
                                            <strong>Nezodpovězených otázek: {unansweredCount}</strong>
                                        </p>
                                    );
                                })()}
                            </div>

                            {/* 🔍 ZOBRAZENÍ PŘEPNUTÍ OKEN */}
                            {windowSwitches > 0 && (
                                <div className="bg-orange-50 border-2 border-orange-400 rounded-lg p-4 mb-6 text-center">
                                    <div className="text-xl font-bold text-orange-800">
                                        ⚠️ Přepnutí oken: {windowSwitches}×
                                    </div>
                                    <p className="text-orange-700 text-sm mt-2">
                                        Během kvízu jsi {windowSwitches}× přepnul na jinou záložku nebo okno. Tato informace bude odeslána učiteli.
                                    </p>
                                </div>
                            )}
                            
                            <div className="text-center mb-8">
                                <div className="text-6xl font-bold text-indigo-600 mb-2">
                                    {score} / {maxBoduCelkem}
                                </div>
                                <div className="text-2xl text-gray-700">
                                    {percentage}% &nbsp;·&nbsp; bodů
                                </div>
                                <div className="mt-4 text-lg font-semibold">
                                    <span className={
                                        znamka === 5 ? 'text-red-600'
                                        : znamka === 4 ? 'text-orange-600'
                                        : znamka === 3 ? 'text-yellow-600'
                                        : znamka === 2 ? 'text-blue-600'
                                        : 'text-green-600'
                                    }>Celkové hodnocení: {znamka}</span>
                                </div>
                            </div>

                            {!emailSent && (
                                <div className="bg-blue-50 border-2 border-blue-300 rounded-lg p-6 mb-6">
                                    <h2 className="text-lg font-bold text-gray-800 mb-3">📤 Odeslání výsledků</h2>
                                    <p className="text-gray-700 mb-1">
                                        <strong>{studentJmeno}</strong>{studentTrida ? ` – ${studentTrida}` : ''}
                                    </p>
                                    <p className="text-gray-600 text-sm mb-4">
                                        {wasTimeExpired
                                            ? 'Čas vypršel. Výsledky se odesílají učiteli.'
                                            : 'Výsledky se odesílají učiteli.'
                                        }
                                    </p>

                                    {chybaOdeslani ? (
                                        <div>
                                            <p className="text-red-600 text-sm mb-3">{chybaOdeslani}</p>
                                            <button
                                                onClick={() => odesliVysledky()}
                                                disabled={isSending}
                                                className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed"
                                            >
                                                {isSending ? 'Odesílám…' : 'Zkusit odeslat znovu'}
                                            </button>
                                        </div>
                                    ) : (
                                        <p className="text-gray-500 text-sm">Odesílám… nezavírej prosím okno.</p>
                                    )}
                                </div>
                            )}

                            {emailSent && (
                                <div className="bg-green-50 border-2 border-green-300 rounded-lg p-6 mb-6 text-center">
                                    <div className="text-4xl mb-2">✓</div>
                                    <p className="text-green-800 font-semibold text-lg mb-2">
                                        Výsledky byly úspěšně odeslány učiteli!
                                    </p>
                                    <p className="text-gray-800 font-bold text-2xl mt-4">
                                        Nyní můžeš zavřít prohlížeč.
                                    </p>
                                </div>
                            )}

                            <div className="space-y-4">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">Přehled odpovědí:</h2>
                                {questions.map((q, index) => {
                                    const userAnswer = answers[index];
                                    const isCorrect = isAnswerCorrect(q, userAnswer);
                                    const b = bodyZaOtazku(q, userAnswer);
                                    const ramecek = isCorrect
                                        ? 'bg-green-50 border-green-300'
                                        : (b > 0 ? 'bg-orange-50 border-orange-300' : 'bg-red-50 border-red-300');

                                    return (
                                        <div key={q.id} className={`p-4 rounded-lg border-2 ${ramecek}`}>
                                            <div className="flex items-start gap-2">
                                                <span className="font-bold text-gray-700">{index + 1}.</span>
                                                <div className="flex-1">
                                                    <p className="text-gray-800 mb-2">{q.question}</p>
                                                    {q.type === 'multiple' && (
                                                        <>
                                                            <p className="text-sm text-gray-600">
                                                                Tvá odpověď: <span className={isCorrect ? 'text-green-700 font-semibold' : 'text-red-700 font-semibold'}>
                                                                    {userAnswer !== undefined ? q.options[userAnswer] : 'Bez odpovědi'}
                                                                </span>
                                                            </p>
                                                            {!isCorrect && (
                                                                <p className="text-sm text-green-700 font-semibold">
                                                                    Správná odpověď: {q.options[q.correct]}
                                                                </p>
                                                            )}
                                                        </>
                                                    )}
                                                    {q.type === 'boolean' && (
                                                        <>
                                                            <p className="text-sm text-gray-600">
                                                                Tvá odpověď: <span className={isCorrect ? 'text-green-700 font-semibold' : 'text-red-700 font-semibold'}>
                                                                    {userAnswer !== undefined ? (userAnswer ? 'Pravda' : 'Nepravda') : 'Bez odpovědi'}
                                                                </span>
                                                            </p>
                                                            {!isCorrect && (
                                                                <p className="text-sm text-green-700 font-semibold">
                                                                    Správná odpověď: {q.correct ? 'Pravda' : 'Nepravda'}
                                                                </p>
                                                            )}
                                                        </>
                                                    )}
                                                    {q.type === 'checkbox' && (() => {
                                                        const ua = Array.isArray(userAnswer) ? userAnswer : [];
                                                        return (
                                                            <>
                                                                <p className="text-sm text-gray-600 mb-1">Tvá odpověď:</p>
                                                                {ua.length === 0 ? (
                                                                    <p className="text-sm text-gray-500 italic mb-1">Bez odpovědi</p>
                                                                ) : (
                                                                    <ul className="text-sm mb-1">
                                                                        {ua.map(i => (
                                                                            <li key={i} className={q.correct.includes(i) ? 'text-green-700 font-semibold' : 'text-red-700 font-semibold'}>
                                                                                {q.correct.includes(i) ? '🟢 +1' : '🔴 −1'} &nbsp;{q.options[i]}
                                                                            </li>
                                                                        ))}
                                                                    </ul>
                                                                )}
                                                                {!isCorrect && (
                                                                    <p className="text-sm text-green-700 font-semibold">
                                                                        Správně mělo být: {q.correct.map(i => q.options[i]).join(' · ')}
                                                                    </p>
                                                                )}
                                                            </>
                                                        );
                                                    })()}
                                                </div>
                                                <span className="text-right flex-shrink-0">
                                                    <span className="text-2xl block">
                                                        {isCorrect ? '✓' : (b > 0 ? '~' : '✗')}
                                                    </span>
                                                    <span className={`text-sm font-bold ${b > 0 ? 'text-green-700' : b < 0 ? 'text-red-700' : 'text-gray-500'}`}>
                                                        {b} / {maxBodu(q)} b.
                                                    </span>
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            const q = questions[currentQuestion];
            const isAnswered = isQuestionAnswered(q, answers[currentQuestion]);
            // Zaškrtávací otázku je možné přeskočit – při záporných bodech je to
            // legitimní volba a formuláře ve velkém testu to umožňují také.
            const lzePokracovat = q.type === 'checkbox' ? true : isAnswered;
            
            // Výpočet barev podle zbývajícího času
            const isTimeCritical = timeLeft <= 120; // 2 minuty nebo méně
            const isTimeVeryLow = timeLeft <= 60; // 1 minuta nebo méně
            
            const timerColor = isTimeVeryLow 
                ? 'bg-red-100 border-red-500' 
                : isTimeCritical 
                    ? 'bg-orange-100 border-orange-400' 
                    : 'bg-blue-100 border-blue-400';
                    
            const timerTextColor = isTimeVeryLow 
                ? 'text-red-800' 
                : isTimeCritical 
                    ? 'text-orange-800' 
                    : 'text-blue-800';

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                    <div className="max-w-3xl mx-auto bg-white rounded-lg shadow-xl p-8">
                        <div className="mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-2xl font-bold text-indigo-900">
                                    Kvíz: {QUIZ_CONFIG.title}
                                </h1>
                                <span className="text-gray-600 font-semibold">
                                    {currentQuestion + 1} / {questions.length}
                                </span>
                            </div>

                            {/* 📏 PRAVIDLA BODOVÁNÍ – stejná jako ve velkých testech */}
                            <div className="bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 mb-4 text-sm text-gray-700">
                                Celkem <strong>{maxBoduCelkem} bodů</strong>. Otázky ANO/NE a s jednou správnou odpovědí za 1 bod.
                                U zaškrtávacích otázek <strong>+1</strong> za správně a <strong>−1</strong> za chybně označenou možnost; celkový součet neklesne pod nulu.
                            </div>

                            {/* ⏱️ ZOBRAZENÍ ČASOVAČE */}
                            <div className={`border-2 rounded-lg p-3 mb-4 text-center ${timerColor}`}>
                                <div className={`text-xl font-bold ${timerTextColor}`}>
                                    {isTimeVeryLow ? '🔴' : isTimeCritical ? '⚠️' : '⏰'} Zbývající čas: {formatTime(timeLeft)}
                                </div>
                                {isTimeCritical && (
                                    <p className={`text-sm mt-1 ${timerTextColor}`}>
                                        {isTimeVeryLow ? 'Čas téměř vypršel!' : 'Pozor, zbývá málo času!'}
                                    </p>
                                )}
                            </div>
                            
                            <div className="w-full bg-gray-200 rounded-full h-2">
                                <div 
                                    className="bg-indigo-600 h-2 rounded-full transition-all duration-300"
                                    style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
                                />
                            </div>
                        </div>

                        <div className="mb-8">
                            <h2 className="text-xl text-gray-800 mb-6 leading-relaxed">
                                {q.question}
                            </h2>

                            {q.type === 'multiple' && (
                                <div className="space-y-3">
                                    {q.options.map((option, index) => (
                                        <button
                                            key={index}
                                            onClick={() => handleAnswer(index)}
                                            className={`w-full text-left p-4 rounded-lg border-2 transition ${
                                                answers[currentQuestion] === index
                                                    ? 'border-indigo-600 bg-indigo-50'
                                                    : 'border-gray-300 hover:border-indigo-400 hover:bg-gray-50'
                                            }`}
                                        >
                                            <span className="font-semibold text-gray-700">{String.fromCharCode(65 + index)}.</span> {option}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {q.type === 'checkbox' && (
                                <div className="space-y-3">
                                    <p className="text-sm font-semibold text-orange-700 bg-orange-50 border border-orange-300 rounded-lg px-3 py-2">
                                        Více správných odpovědí ({q.correct.length} z 6). Za každou správně označenou možnost <strong>+1 bod</strong>, za každou chybně označenou <strong>−1 bod</strong>.
                                        Tipovat se nevyplatí – když si nejsi jistý, raději možnost neoznačuj.
                                    </p>
                                    {q.options.map((option, index) => {
                                        const checked = Array.isArray(answers[currentQuestion]) && answers[currentQuestion].includes(index);
                                        return (
                                            <button
                                                key={index}
                                                onClick={() => toggleCheckbox(index)}
                                                className={`w-full text-left p-4 rounded-lg border-2 transition flex items-start gap-3 ${
                                                    checked
                                                        ? 'border-indigo-600 bg-indigo-50'
                                                        : 'border-gray-300 hover:border-indigo-400 hover:bg-gray-50'
                                                }`}
                                            >
                                                <span className={`mt-0.5 flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center text-xs font-bold ${
                                                    checked ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-400 bg-white'
                                                }`}>{checked ? '✓' : ''}</span>
                                                <span><span className="font-semibold text-gray-700">{String.fromCharCode(65 + index)}.</span> {option}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}

                            {q.type === 'boolean' && (
                                <div className="space-y-3">
                                    <button
                                        onClick={() => handleAnswer(true)}
                                        className={`w-full text-left p-4 rounded-lg border-2 transition ${
                                            answers[currentQuestion] === true
                                                ? 'border-indigo-600 bg-indigo-50'
                                                : 'border-gray-300 hover:border-indigo-400 hover:bg-gray-50'
                                        }`}
                                    >
                                        <span className="font-semibold text-gray-700">Pravda</span>
                                    </button>
                                    <button
                                        onClick={() => handleAnswer(false)}
                                        className={`w-full text-left p-4 rounded-lg border-2 transition ${
                                            answers[currentQuestion] === false
                                                ? 'border-indigo-600 bg-indigo-50'
                                                : 'border-gray-300 hover:border-indigo-400 hover:bg-gray-50'
                                        }`}
                                    >
                                        <span className="font-semibold text-gray-700">Nepravda</span>
                                    </button>
                                </div>
                            )}
                        </div>

                        <div className="flex gap-2 sm:gap-3">
                            <button
                                onClick={handleFirst}
                                disabled={currentQuestion === 0}
                                title="Na začátek"
                                className="px-4 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                ⇤
                            </button>
                            <button
                                onClick={handlePrevious}
                                disabled={currentQuestion === 0}
                                className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-400 transition disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                ← Zpět
                            </button>
                            <button
                                onClick={handleNext}
                                disabled={!lzePokracovat}
                                className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {currentQuestion === questions.length - 1 ? 'Dokončit' : 'Další →'}
                            </button>
                            <button
                                onClick={handleLast}
                                disabled={currentQuestion === questions.length - 1}
                                title="Na konec"
                                className="px-4 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                ⇥
                            </button>
                        </div>

                        {(() => {
                            const unanswered = questions.filter((qq, i) => !isQuestionAnswered(qq, answers[i])).length;
                            return unanswered > 0 ? (
                                <p className="text-center text-gray-500 text-sm mt-3">
                                    Nezodpovězených otázek: <strong>{unanswered}</strong>
                                </p>
                            ) : null;
                        })()}

                        {!lzePokracovat && (
                            <p className="text-center text-gray-500 text-sm mt-4">
                                Pro pokračování vyber odpověď
                            </p>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BunkaQuiz />);
    </script>
</body>
</html>
